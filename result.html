<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>케미케미 · 궁합 리포트</title>
  <meta name="description" content="사주와 MBTI로 본 두 사람의 궁합 리포트">
  <meta property="og:type" content="website">
  <meta property="og:title" content="케미케미 · 우리 둘의 궁합 리포트">
  <meta property="og:description" content="타고난 기운과 대화 스타일로 본 케미 점수를 확인해 보세요.">
  <!-- 2단계: <meta property="og:image" content="https://도메인/og.png"> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-page="result">
  <header class="site-head">
    <a class="brand" href="/"><span class="seal">合</span>케미케미</a>
  </header>

  <main class="page report" id="report" hidden>
    <section class="card hero">
      <p class="eyebrow">궁합 리포트</p>
      <h1 class="pair-names"><span id="name-a"></span><span class="amp">&amp;</span><span id="name-b"></span></h1>
      <div class="people" id="people"></div>
      <div class="gauges" id="gauges"></div>
    </section>

    <section class="card section" id="saju-card">
      <p class="kicker">타고난 기운 · 일간 오행</p>
      <h2 class="section-title" id="saju-headline"></h2>
      <div class="ohaeng" id="ohaeng"></div>
      <p class="body-text" id="saju-text"></p>
      <p class="note" id="yinyang-text"></p>
    </section>

    <section class="card section" id="mbti-card">
      <p class="kicker">대화 · 생활 스타일 · MBTI</p>
      <h2 class="section-title" id="mbti-headline"></h2>
      <p class="special" id="mbti-special" hidden></p>
      <ul class="letters" id="letters"></ul>
    </section>

    <section class="card section ai" id="ai-card">
      <p class="kicker">AI 상세 해설</p>
      <div id="ai-body" class="ai-body" hidden></div>
      <button type="button" class="btn btn-ink btn-wide" id="ai-btn">AI 상세 해설 보기</button>
      <p class="hint center" id="ai-quota"></p>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="save-img">이미지로 저장</button>
      <button type="button" class="btn" id="copy-link">링크 복사</button>
    </div>
    <a class="btn btn-primary btn-wide" id="try-own" href="/" hidden>나도 궁합 보기</a>
    <a class="text-link" id="again" href="/" hidden>다른 사람과 다시 보기</a>
  </main>

  <main class="page" id="invalid" hidden>
    <section class="card section center">
      <h1 class="section-title">결과를 불러올 수 없어요</h1>
      <p class="body-text">링크가 잘렸거나 잘못된 것 같아요.</p>
      <a class="btn btn-primary btn-wide" href="/">궁합 보러 가기</a>
    </section>
  </main>

  <footer class="site-foot">케미케미의 궁합 결과는 재미로 보는 콘텐츠예요.</footer>

  <!-- 인스타 스토리용 9:16 카드 (화면 밖에 그려 두고 이미지로만 사용) -->
  <div class="story-stage" aria-hidden="true">
    <div class="story" id="story">
      <div class="story-head"><span class="seal">合</span>케미케미</div>
      <p class="story-names" id="story-names"></p>
      <p class="story-mbti" id="story-mbti"></p>
      <div class="story-gauges" id="story-gauges"></div>
      <p class="story-headline" id="story-headline"></p>
      <div class="story-ohaeng" id="story-ohaeng"></div>
      <div class="story-foot">
        <p class="story-url" id="story-url"></p>
        <p class="story-note">재미로 보는 궁합이에요</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
